name: Bug report
description: Something doesn't work or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. A short, clear report helps a lot.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I opened notes.md and the diagram showed as code instead of a picture."
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown that shows the problem
      description: If the problem is about how a document looks, paste a small piece of it here.
      render: markdown
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag a screenshot here if it helps.
  - type: input
    id: version
    attributes:
      label: MD Reader version
      description: Shown in the About box (click the crab in the top-left corner).
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme and wallpaper
      description: Optional, but useful for anything visual.
      placeholder: "Paper · Notebook, wallpaper off"
