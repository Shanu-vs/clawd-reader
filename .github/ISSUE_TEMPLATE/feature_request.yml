name: Feature idea
description: Suggest something new or a change to how MD Reader works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do, and what gets in the way today.
      placeholder: "I keep notes in subfolders, and wiki links to them don't open."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work? Sketches and examples from other apps are welcome.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, screenshots, or the Markdown you'd use it with.
