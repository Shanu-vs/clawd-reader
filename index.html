<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Reader</title>
  </head>
  <body>
    <!-- Live wallpaper fills the whole window behind everything -->
    <canvas id="wallpaper" aria-hidden="true"></canvas>

    <header id="toolbar" class="no-print" data-tauri-drag-region>
      <div class="toolbar-group" data-tauri-drag-region>
        <button id="btn-open" class="tb" data-icon="open" title="Open a Markdown file (O)"><span>Open</span></button>
        <button id="btn-toc" class="tb" data-icon="contents" title="Table of contents (C)"><span>Contents</span></button>
        <div id="edit-group" class="split-btn">
          <button id="btn-edit" class="tb" title="Edit this document (E)"></button>
          <button id="btn-save-menu" class="tb split-caret" data-icon="chevron" title="More save options" aria-label="More save options" aria-haspopup="menu" aria-expanded="false" hidden></button>
          <div id="save-menu" class="dropdown" role="menu" hidden></div>
        </div>
      </div>
      <div id="doc-title" class="toolbar-title" data-tauri-drag-region>MD Reader</div>
      <div class="toolbar-group" data-tauri-drag-region>
        <button id="btn-mode" class="tb icon" data-icon="theme" title="Switch light / dark (T)" aria-label="Switch light or dark"></button>
        <button id="btn-focus" class="tb icon" data-icon="focus" title="Focus mode (F)" aria-label="Focus mode"></button>
        <button id="btn-pdf" class="tb icon" data-icon="pdf" title="Export as PDF (P)" aria-label="Export as PDF"></button>
        <button id="btn-settings" class="tb icon" data-icon="settings" title="Settings (S)" aria-label="Settings"></button>
      </div>
      <div id="win-controls" hidden>
        <button id="win-min" data-icon="minimize" title="Minimise" aria-label="Minimise"></button>
        <button id="win-max" data-icon="maximize" title="Maximise" aria-label="Maximise"></button>
        <button id="win-close" data-icon="close" title="Close" aria-label="Close"></button>
      </div>
      <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden />
    </header>

    <div id="progress" class="no-print"><div id="progress-bar"></div></div>

    <nav id="toc" class="panel no-print" aria-label="Table of contents" hidden></nav>

    <main id="scroller">
      <article id="doc" class="markdown-body"></article>
      <textarea id="editor" class="no-print" spellcheck="true" aria-label="Markdown source" hidden></textarea>
      <footer id="doc-meta" class="no-print"></footer>
    </main>

    <aside id="settings" class="panel no-print" aria-label="Settings" hidden></aside>

    <div id="toast" class="no-print" role="status" aria-live="polite"></div>

    <div id="place-banner" class="no-print" aria-live="polite"></div>

    <div id="drop-overlay" class="no-print" hidden><div>Drop your Markdown file</div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
